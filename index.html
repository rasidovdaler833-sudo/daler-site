<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daler Rashidov</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0a0a0a;
color:#fff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.bg{
position:fixed;
inset:0;
background:radial-gradient(circle at 20% 20%, rgba(0,136,204,.2), transparent 30%),
radial-gradient(circle at 80% 80%, rgba(0,136,204,.15), transparent 30%);
z-index:-1;
}

.card{
width:90%;
max-width:800px;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.08);
border-radius:24px;
padding:50px;
text-align:center;
}

.avatar{
width:120px;
height:120px;
margin:0 auto 25px;
border-radius:50%;
background:linear-gradient(135deg,#0088cc,#00bfff);
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
font-weight:bold;
}

h1{font-size:48px;margin-bottom:10px;}
.subtitle{color:#00bfff;font-size:20px;margin-bottom:25px;}
.description{color:#cfcfcf;line-height:1.8;font-size:18px;margin-bottom:40px;}

/* КНОПКА ЧАТА */
#chatBtn{
position:fixed;
right:20px;
bottom:20px;
width:60px;
height:60px;
border-radius:50%;
background:#0088cc;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
cursor:pointer;
z-index:9999;
}

/* ОКНО ЧАТА */
#chatBox{
position:fixed;
right:20px;
bottom:100px;
width:320px;
height:420px;
background:rgba(10,10,10,0.95);
border:1px solid #333;
display:none;
flex-direction:column;
z-index:9999;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
font-size:14px;
color:white;
}

#input{
width:100%;
height:60px;
box-sizing:border-box;
}

button{
background:#0088cc;
color:white;
border:none;
padding:10px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="bg"></div>

<div class="card">
<div class="avatar">DR</div>
<h1>Daler Rashidov</h1>
<div class="subtitle">Помощь пожилым людям</div>
<div class="description">
Помогаю людям осваивать технологии и интернет.
</div>
</div>

<!-- ЧАТ -->
<div id="chatBtn">💬</div>

<div id="chatBox">
<div id="messages"></div>
<textarea id="input" placeholder="Напиши сообщение..."></textarea>
<button onclick="send()">Отправить</button>
</div>

<script>
let clientId = localStorage.getItem("cid");

if(!clientId){
clientId = "User_" + crypto.randomUUID();
localStorage.setItem("cid", clientId);
}

const btn = document.getElementById("chatBtn");
const box = document.getElementById("chatBox");

btn.onclick = () => {
if(box.style.display === "flex"){
box.style.display = "none";
} else {
box.style.display = "flex";
box.style.flexDirection = "column";
load();
}
};

function send(){
let text = document.getElementById("input").value;

if(!text.trim()) return;

fetch("https://wpanqbot.onrender.com/send", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
client_id: clientId,
message: text
})
});

document.getElementById("input").value="";
}

function load(){
fetch("https://wpanqbot.onrender.com/chat/" + clientId)
.then(r=>r.json())
.then(data=>{
let box = document.getElementById("messages");
box.innerHTML = "";

data.forEach(m=>{
let div = document.createElement("div");

div.className =
m.sender === "user"
? "msg user"
: "msg admin";

div.innerText = m.message;

box.appendChild(div);
});
});
}

setInterval(load, 2000);
</script>

</body>
</html>

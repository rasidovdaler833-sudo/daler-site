<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Support Chat</title>

<style>
body {
margin:0;
font-family:sans-serif;
background:#0a0a0a;
color:white;
}

#chatBtn {
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:#0088cc;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
cursor:pointer;
}

#chatBox {
position:fixed;
bottom:100px;
right:20px;
width:300px;
height:400px;
background:#111;
border:1px solid #333;
display:none;
flex-direction:column;
}

#messages {
flex:1;
overflow:auto;
padding:10px;
}

.msg-user {color:#00bfff;}
.msg-admin {color:#2ecc71;}

textarea {
width:100%;
box-sizing:border-box;
height:60px;
}

button {
width:100%;
background:#0088cc;
color:white;
border:none;
padding:10px;
}
</style>
</head>

<body>

<div id="chatBtn">💬</div>

<div id="chatBox">
<div id="messages"></div>
<textarea id="input"></textarea>
<button onclick="send()">Send</button>
</div>

<script>
let clientId = localStorage.getItem("cid");

if(!clientId){
clientId = "User_" + crypto.randomUUID();
localStorage.setItem("cid", clientId);
}

const box = document.getElementById("chatBox");
const btn = document.getElementById("chatBtn");

btn.onclick = () => {
box.style.display = box.style.display === "flex" ? "none" : "flex";
box.style.flexDirection = "column";
load();
}

function send(){
let text = document.getElementById("input").value;

fetch("https://wpanqbot.onrender.com/send", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
client_id: clientId,
message: text
})
});

document.getElementById("input").value="";
}

function load(){
fetch("https://wpanqbot.onrender.com/chat/" + clientId)
.then(r=>r.json())
.then(data=>{
let box = document.getElementById("messages");
box.innerHTML = "";

data.forEach(m=>{
let div = document.createElement("div");
div.innerText = m.sender + ": " + m.message;
box.appendChild(div);
});
});
}

setInterval(load, 3000);
</script>

</body>
</html>
